name: Validate plugin
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate plugin and marketplace manifests
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.286
          claude plugin validate gumnut-photos
          claude plugin validate .
      - name: Check skills stay portable across Claude and ChatGPT
        run: pipx run scripts/check_skills.py
